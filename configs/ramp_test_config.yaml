# Temperature Ramp Test Configuration

instrument:
  name: "Lakeshore336"
  port: "GPIB0::12::INSTR"
  output_channel: 1  # Heater output to use (1-4)

pid:
  P: 130  # Proportional gain
  I: 35   # Integral gain
  D: 10   # Derivative gain

ramp_test:
  start_temp: 3.5        # Starting temperature in K
  target_temp: 6.0       # Target temperature for ramp in K
  ramp_rate: 1.0         # Ramp rate in K/min
  recording_interval: 1.0 # Time between recordings in seconds
  hold_time: 60          # Time to hold at target temperature (seconds)

stability:
  tolerance: 0.1           # Temperature tolerance for stability in K (100 mK)
  required_stable_readings: 5 # Number of consecutive stable readings required
  check_interval: 1.0      # Time between stability checks in seconds
  max_wait_initial: 300    # Maximum time to wait for initial stabilization

analysis:
  save_csv: true
  save_plots: true
  output_directory: "ramp_test_results"

# Ramp rate presets for different applications
presets:
  slow_ramp:
    ramp_rate: 0.5       # K/min - very controlled
    hold_time: 120       # seconds
  
  medium_ramp:
    ramp_rate: 1.0       # K/min - balanced
    hold_time: 60        # seconds
  
  fast_ramp:
    ramp_rate: 2.0       # K/min - quick test
    hold_time: 30        # seconds
